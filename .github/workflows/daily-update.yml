name: daily-update
on:
  schedule:
    - cron: '17 1 * * *'   # 每天 09:17（台北時間）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the 旧约导读 playlist and add new videos / chapters
        run: python3 tools/update.py
      - name: Commit and publish if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "321ot-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Auto: 每日更新舊約導讀影片／新章節"
            git push
          else
            echo "no changes"
          fi
